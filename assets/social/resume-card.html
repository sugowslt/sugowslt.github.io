<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200, initial-scale=1" />
    <title>신재현 | 백엔드 개발자</title>
    <style>
      @font-face {
        font-family: "SUIT";
        font-style: normal;
        font-weight: 100 900;
        src: url("../../static/fonts/SUIT-Variable.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #f3f3f3;
      }

      main {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 30px;
        width: 100%;
        height: 100%;
        padding: 0 112px 12px;
        font-family: "SUIT", sans-serif;
        letter-spacing: -0.025em;
      }

      h1 {
        margin: 0;
        color: #111;
        font-size: 160px;
        font-weight: 700;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #497af4;
        font-size: 72px;
        font-weight: 500;
        line-height: 1.25;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>신재현</h1>
      <p>Backend Developer</p>
    </main>
  </body>
</html>
